<p-toolbar styleClass="app-header">
  <ng-template pTemplate="start">
    <div class="brand">
      <a routerLink="/" class="brand-link">
        <h1>The Dino Project</h1>
      </a>
    </div>
  </ng-template>
  
  <ng-template pTemplate="center">
    <div class="main-nav-wrapper">
      <nav class="main-nav">
        @for (item of menuItems; track item.label) {
          <a 
            [routerLink]="item.routerLink" 
            class="nav-link"
            [class.active]="item.styleClass?.includes('active-menu-item')"
            routerLinkActive="active">
            <i [class]="item.icon"></i>
            <span class="nav-label">{{ item.label }}</span>
          </a>
        }
      </nav>
      <a class="donate-button menu-donate" href="https://paypal.me/JohnReynolds37" target="_blank" rel="noopener noreferrer">Donate</a>
    </div>
  </ng-template>
  
  <ng-template pTemplate="end">
    <app-user-menu />
  </ng-template>
</p-toolbar>

<main class="app-main">
  <p-toast position="top-right" />
  <router-outlet />
</main>
