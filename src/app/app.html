<button (click)="generateRandomHand()">Generate Hand</button>

<div class="game-container">
  <div class="hand-section">
    <h2 class="zone-label">Hand</h2>
    <div 
      cdkDropList 
      #handList="cdkDropList"
      [cdkDropListData]="currentHand"
      (cdkDropListDropped)="onHandDrop($event)"
      class="hand-zone">
      @for (card of currentHand; track card; let i = $index) {
        <div 
          cdkDrag
          [cdkDragData]="{card: card, index: i, source: 'hand'}"
          (cdkDragEnded)="onHandCardDragEnded($event, card, i)"
          class="hand-card card">
          <img [src]="getImageUrl(card)" [alt]="card" />
        </div>
      }
    </div>
  </div>

  <div class="battlefield-section">
    <h2 class="zone-label">Battlefield</h2>
    <div class="battlefield-zone">
      @for (cardData of battlefield; track cardData; let i = $index) {
        <div 
          cdkDrag
          (cdkDragEnded)="onBattlefieldCardDragEnded($event, i)"
          [style.left.px]="cardData.x"
          [style.top.px]="cardData.y"
          class="battlefield-card card">
          <img [src]="getImageUrl(cardData.card)" [alt]="cardData.card" />
        </div>
      }
    </div>
  </div>
</div>

<router-outlet />
