<p-toolbar styleClass="app-header">
  <ng-template pTemplate="start">
    <div class="brand">
      <a routerLink="/" class="brand-link">
        <h1>Etali Data Collection</h1>
      </a>
    </div>
  </ng-template>
  
  <ng-template pTemplate="center">
    <div class="main-nav-wrapper">
      <p-menubar [model]="menuItems" styleClass="main-nav"></p-menubar>
      <a class="donate-button menu-donate" href="https://paypal.me/JohnReynolds37" target="_blank" rel="noopener noreferrer">Donate</a>
    </div>
  </ng-template>
  
  <ng-template pTemplate="end">
    <app-user-menu />
  </ng-template>
</p-toolbar>

<main class="app-main">
  <p-toast position="top-right" />
  <router-outlet />
</main>
