<main class="decklist-selection-container">
  <div class="header">
    <div class="header-left">
      <h1>Select a Decklist</h1>
    </div>
    <div class="header-right">
      <p-button 
        (onClick)="viewComparisons()" 
        label="Deck Comparisons"
        icon="pi pi-arrows-h"
        [outlined]="true"></p-button>
      <p-button 
        (onClick)="openAddDecklistModal()" 
        label="Add New Decklist"
        icon="pi pi-plus"
        severity="success"></p-button>
    </div>
  </div>
  
  <div class="decklists-grid">
    @if (decklistService.decklists().length === 0) {
      <div class="empty-state">
        <i class="pi pi-inbox empty-icon"></i>
        <p class="no-decklists">No decklists yet. Create your first decklist to get started!</p>
      </div>
    }
    
    @for (decklist of decklistService.decklists(); track decklist.id) {
      <p-card 
        [header]="decklist.name"
        styleClass="decklist-card">
        <div class="card-content">
          <i class="pi pi-list"></i>
          <span class="card-count">{{ decklist.cards.length }} cards</span>
        </div>
        <div class="card-actions">
          <p-button 
            label="View Decklist"
            icon="pi pi-eye"
            severity="secondary"
            (onClick)="viewDecklist(decklist)"
            styleClass="action-button">
          </p-button>
          <p-button 
            label="Test Hands"
            icon="pi pi-play"
            (onClick)="onDecklistSelected(decklist)"
            styleClass="action-button">
          </p-button>
          <p-button 
            label="Statistics"
            icon="pi pi-chart-bar"
            severity="secondary"
            (onClick)="viewStatistics(decklist)"
            styleClass="action-button">
          </p-button>
        </div>
      </p-card>
    }
  </div>
</main>

<p-dialog 
  [visible]="showModal()"
  (visibleChange)="showModal.set($event)"
  header="Add New Decklist"
  [modal]="true"
  [style]="{width: '600px'}"
  [draggable]="false"
  [resizable]="false"
  [closeButtonProps]="{ariaLabel: 'Close dialog'}">
  <app-decklist-form (decklistAdded)="onDecklistAdded()"></app-decklist-form>
</p-dialog>
