<div class="decklist-selection-container">
  <div class="header">
    <h1>Select a Decklist</h1>
    <p-button 
      (onClick)="openAddDecklistModal()" 
      label="Add New Decklist"
      icon="pi pi-plus"
      severity="success"></p-button>
  </div>
  
  <div class="decklists-grid">
    @if (decklistService.decklists().length === 0) {
      <div class="empty-state">
        <i class="pi pi-inbox empty-icon"></i>
        <p class="no-decklists">No decklists yet. Create your first decklist to get started!</p>
      </div>
    }
    
    @for (decklist of decklistService.decklists(); track decklist.id) {
      <p-card 
        [header]="decklist.name"
        styleClass="decklist-card cursor-pointer"
        (click)="onDecklistSelected(decklist)">
        <div class="card-content">
          <i class="pi pi-list"></i>
          <span class="card-count">{{ decklist.cardNames.length }} cards</span>
        </div>
      </p-card>
    }
  </div>
</div>

<p-dialog 
  [visible]="showModal()"
  (visibleChange)="showModal.set($event)"
  header="Add New Decklist"
  [modal]="true"
  [style]="{width: '600px'}"
  [draggable]="false"
  [resizable]="false">
  <app-decklist-form (decklistAdded)="onDecklistAdded()"></app-decklist-form>
</p-dialog>
