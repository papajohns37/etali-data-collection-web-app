# Render.com deployment configuration
# This file configures the deployment settings for Render

services:
  # Static Site for Angular Frontend
  - type: static_site
    name: mtg-data-frontend
    env: static
    buildCommand: npm ci && npm run build:prod
    publishPath: dist/mtg-data/browser
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: API_URL
        sync: false # Set this manually in Render dashboard or use environment groups
      - key: ENABLE_ANALYTICS
        value: true
      - key: TOKEN_KEY
        value: mtg_auth_token
      - key: USER_KEY
        value: mtg_auth_user
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-XSS-Protection
        value: 1; mode=block
    routes:
      # Rewrite only requests that do NOT contain a file extension
      # This ensures requests for static assets (e.g., main.js, styles.css)
      # are served normally and only SPA routes are rewritten to index.html.
      - type: rewrite
        source: '/^\/(?!.*\.[^\/]+$).*/'
        destination: /index.html
